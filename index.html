<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#20211f" />
    <meta
      name="description"
      content="Web design, development, and maintenance for independent businesses. Based in Moreno Valley. Start with a free homepage redesign mockup."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://jacobwebsites.com/" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Jacob Websites — Web Design for Independent Businesses | Moreno Valley"
    />
    <meta
      property="og:description"
      content="Good work deserves more calls. Web design for independent businesses in Moreno Valley and beyond. Start with a free homepage mockup."
    />
    <meta property="og:url" content="https://jacobwebsites.com/" />
    <title>Jacob Websites — Built to be yours.</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("jw-theme") ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <script>
      try {
        var motion = localStorage.getItem("jw-motion");
        document.documentElement.dataset.motion =
          motion === "reduce" ||
          (!motion && matchMedia("(prefers-reduced-motion: reduce)").matches)
            ? "reduce"
            : "full";
      } catch {
        document.documentElement.dataset.motion = matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches
          ? "reduce"
          : "full";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
